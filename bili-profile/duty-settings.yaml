# ============================================================================
# 值班轮（刷视频）专用 settings —— 只有 bili-duty profile 读它
# ============================================================================
# 为什么单独一份：
#   `agent-default-model` 这个服务是「settings 用户层 > 组合配置」——
#   只要 ~/.dsh/settings.yaml 里写了 agent-default-model，overlay 里的
#   `- id: agent-default-model` 就**永远被盖掉**（这也是之前把值班轮钉到
#   视觉模型一直不生效的真正原因）。
#   而 --patch overlay 没法改 settings 文件路径，profile patch 可以
#   （`- id: settings / config.path`）⇒ 值班轮读这份文件，主会话照旧读
#   ~/.dsh/settings.yaml，两边互不影响。
#
# 2026-10-29：值班轮改走「清华给的 DeepSeek 接口」（llmapi.paratera.com），
#   主会话继续用 DeepSeek 官方。视觉模型 = 那条链路上带 image 的那个，
#   bili_cover / bili_frames「看画面」链路靠它活着。
agent-default-model:
  provider: tsinghua-api
  model: DeepSeek-V4-Flash-Vision-Exp
  reasoningEffort: high
# 值班轮不给它放权：它本来就只有 B站 MCP 那几只手
permission:
  defaultPreset: read-only

# ⚠️ 换了 settings 文件之后，`llm-pi-ai` 的 provider 路由也要在这份里重新声明 ——
#    它同样是走 settings 用户层读的；缺了这段那一轮直接
#    `NO_ADAPTER: no adapter registered for provider "tsinghua-api"` 起不来。
llm-pi-ai:
  providers:
    tsinghua-api:
      displayName: 清华API
      apiKeyEnv: TSINGHUA_API_API_KEY
      api: openai-completions
      baseURL: https://llmapi.paratera.com/v1
      defaultContextWindow: 1048576
      models:
        - id: DeepSeek-V4-Flash-Vision-Exp
          name: DeepSeek-V4-Flash-Vision-Exp
          # 这条网关不会在 /v1/models 里报模态 ⇒ 必须手写，否则 bili_cover /
          # bili_frames 会以 image_skip_reason: model_no_image 直接跳过画面
          input:
            - text
            - image
          # 同上：不写 reasoningEfforts，DSH 认为这个模型不支持思考档位，
          # 那一轮直接 UNSUPPORTED_REASONING_EFFORT 起不来
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
            max: max
        - id: DeepSeek-V4-Flash-0731
          name: DeepSeek-V4-Flash-0731
          reasoningEfforts:
            off:
            high: high
            max: max
        - id: DeepSeek-V4-Pro-0813
          name: DeepSeek-V4-Pro
          input:
            - text
            - image
          reasoningEfforts:
            off:
            high: high
            max: max
